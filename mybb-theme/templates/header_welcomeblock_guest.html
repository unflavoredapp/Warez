<div class="yh-userpanel yh-userpanel-guest">
	<div class="yh-userpanel-avatar yh-avatar-guest" aria-hidden="true"></div>
	<ul class="yh-userpanel-links">
		<li class="yh-userpanel-name"><span class="yh-ico yh-ico-user"></span>Guest</li>
		<li><span class="yh-ico yh-ico-login"></span><a href="{$mybb->settings['bburl']}/member.php?action=login" onclick="$('#quick_login').modal({ fadeDuration: 250, keepelement: true, zIndex: (typeof modal_zindex !== 'undefined' ? modal_zindex : 9999) }); return false;">Log in</a></li>
		<li><span class="yh-ico yh-ico-register"></span><a href="{$mybb->settings['bburl']}/member.php?action=register">Register</a></li>
	</ul>
</div>
<div class="modal" id="quick_login" style="display: none;">
	<form method="post" action="{$mybb->settings['bburl']}/member.php">
		<input name="action" type="hidden" value="do_login" />
		<input name="url" type="hidden" value="" />
		<input name="quick_login" type="hidden" value="1" />
		<input name="my_post_key" type="hidden" value="{$mybb->post_code}" />
		<table width="100%" cellspacing="{$theme['borderwidth']}" cellpadding="{$theme['tablespace']}" border="0" class="tborder">
			<tr>
				<td class="thead" colspan="2"><strong>{$lang->login}</strong></td>
			</tr>
			{$loginform}
		</table>
	</form>
</div>
<script type="text/javascript">
	$("#quick_login input[name='url']").val($(location).attr('href'));
</script>
