<div class="yh-loginbox">
	<form method="post" action="{$mybb->settings['bburl']}/member.php" class="yh-login-form">
		<input type="hidden" name="action" value="do_login" />
		<input type="hidden" name="url" id="yh_login_url" value="" />
		<input type="hidden" name="quick_login" value="1" />
		<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />

		<div class="yh-login-row yh-login-top">
			<span class="yh-hello">Hello, Guest ^_^</span>
			<a class="yh-btn-register" href="{$mybb->settings['bburl']}/member.php?action=register">Register</a>
		</div>

		<div class="yh-login-row yh-login-fields">
			<input type="text" name="quick_username" class="textbox yh-login-input" placeholder="Username" autocomplete="username" />
			<input type="password" name="quick_password" class="textbox yh-login-input" placeholder="Password" autocomplete="current-password" />
			<button type="submit" class="button yh-btn-login" name="submit">Login</button>
		</div>

		<div class="yh-login-row yh-login-bottom">
			<a class="yh-lostpw" href="{$mybb->settings['bburl']}/member.php?action=lostpw">Forgot password?</a>
			<label class="yh-remember" for="yh_quick_remember">
				<input type="checkbox" name="quick_remember" id="yh_quick_remember" value="yes" checked="checked" />
				Remember?
			</label>
		</div>
	</form>
</div>
<script type="text/javascript">
	(function () {
		var el = document.getElementById('yh_login_url');
		if (el) el.value = window.location.href;
	})();
</script>
