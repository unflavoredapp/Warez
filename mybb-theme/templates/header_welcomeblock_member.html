<div class="yh-loginbox yh-loginbox-member{$yh_panelbg_class}"{$yh_panelbg_style}>
	<div class="yh-panel-overlay" aria-hidden="true"></div>
	<div class="yh-userpanel">
		<div class="yh-userpanel-chat">
			<div class="yh-act-title">Live Chat</div>
			<ul class="yh-act-list yh-act-feed yh-chat-feed" id="yh_panelchat_feed">
				{$yh_panelchat_feed}
			</ul>
			<form class="yh-chat-form" id="yh_panelchat_form" action="{$mybb->settings['bburl']}/panelchat.php" method="post" autocomplete="off">
				<input type="hidden" name="my_post_key" value="{$mybb->post_code}" />
				<input type="text" name="message" id="yh_panelchat_input" class="yh-chat-input" maxlength="200" placeholder="Say something…" />
				<button type="submit" class="yh-chat-send" aria-label="Send">➤</button>
			</form>
		</div>
		<div class="yh-userpanel-scar" aria-hidden="true"></div>
		<div class="yh-userpanel-right">
			<a class="yh-userpanel-avatar" href="{$mybb->settings['bburl']}/member.php?action=profile&amp;uid={$mybb->user['uid']}">
				<img src="{$yh_avatar}" alt="{$mybb->user['username']}" />
			</a>
			<ul class="yh-userpanel-links">
				<li class="yh-userpanel-name"><span class="yh-ico yh-ico-user"></span><a href="{$mybb->settings['bburl']}/member.php?action=profile&amp;uid={$mybb->user['uid']}">{$mybb->user['username']}</a></li>
				<li><span class="yh-ico yh-ico-bits"></span><a href="{$mybb->settings['bburl']}/bits.php"><span class="yh-bits-inline">{$yh_bits_fmt}</span> Bits</a></li>
				<if $mybb->user['bits'] >= 100 then>
				<li class="yh-bits-badge">◈ High Roller</li>
				</if>
				<li><span class="yh-ico yh-ico-cp"></span><a href="{$mybb->settings['bburl']}/usercp.php">UserCP</a></li>
				<li><span class="yh-ico yh-ico-bg"></span><a href="{$mybb->settings['bburl']}/usercp.php?action=panelbg">Panel BG</a></li>
				<li><span class="yh-ico yh-ico-profile"></span><a href="{$mybb->settings['bburl']}/member.php?action=profile&amp;uid={$mybb->user['uid']}">My Profile</a></li>
				<li><span class="yh-ico yh-ico-alert"></span><a href="{$mybb->settings['bburl']}/private.php">Alerts ({$mybb->user['pms_unread']})</a></li>
				<li><span class="yh-ico yh-ico-logout"></span><a href="{$mybb->settings['bburl']}/member.php?action=logout&amp;logoutkey={$mybb->user['logoutkey']}">Log Out</a></li>
			</ul>
		</div>
	</div>
</div>
{$yh_panelchat_js}
