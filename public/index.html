<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>warez.skin</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b0d12;
      --card: #151922;
      --text: #e8ecf4;
      --muted: #9aa3b5;
      --accent: #7c5cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background:
        radial-gradient(1200px 600px at 20% -10%, rgba(124, 92, 255, 0.25), transparent 60%),
        radial-gradient(900px 500px at 90% 110%, rgba(56, 189, 248, 0.18), transparent 55%),
        var(--bg);
      color: var(--text);
    }
    main {
      width: min(92vw, 560px);
      padding: 2rem;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 18px;
      background: color-mix(in srgb, var(--card) 92%, transparent);
      backdrop-filter: blur(8px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(1.8rem, 4vw, 2.4rem);
      letter-spacing: -0.03em;
    }
    p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: rgba(124, 92, 255, 0.18);
      color: #cbbdff;
      font-size: 0.85rem;
      border: 1px solid rgba(124, 92, 255, 0.35);
    }
  </style>
</head>
<body>
  <main>
    <h1>warez.skin</h1>
    <p>Apache virtual host is live with HTTPS.</p>
    <div class="badge">Let's Encrypt · Certbot</div>
  </main>
</body>
</html>
