<VirtualHost *:80>
    ServerName warez.skin
    ServerAlias www.warez.skin

    DocumentRoot /var/www/warez.skin

    <Directory /var/www/warez.skin>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex portal.php index.php
    </Directory>

    RewriteEngine on
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog ${APACHE_LOG_DIR}/warez.skin-error.log
    CustomLog ${APACHE_LOG_DIR}/warez.skin-access.log combined
</VirtualHost>
