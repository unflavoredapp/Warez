<VirtualHost *:80>
    ServerName warez.skin
    ServerAlias www.warez.skin
    DocumentRoot /var/www/warez.skin

    <Directory /var/www/warez.skin>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/warez.skin-error.log
    CustomLog ${APACHE_LOG_DIR}/warez.skin-access.log combined
</VirtualHost>
