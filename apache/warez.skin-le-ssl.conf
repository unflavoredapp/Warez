<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName warez.skin
    ServerAlias www.warez.skin

    DocumentRoot /var/www/warez.skin

    <Directory /var/www/warez.skin>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
        DirectoryIndex index.php portal.php
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/warez.skin-error.log
    CustomLog ${APACHE_LOG_DIR}/warez.skin-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/warez.skin/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/warez.skin/privkey.pem
</VirtualHost>
</IfModule>
